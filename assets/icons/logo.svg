<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="logo-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Hexagon Boundary -->
  <polygon points="24,4 42,14 42,34 24,44 6,34 6,14" stroke="url(#logo-cyan)" stroke-width="2.5" fill="#070B14" filter="url(#glow)"/>
  <!-- Central M Symbol with Connected Nodes -->
  <path d="M14 31 L14 17 L24 26 L34 17 L34 31" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Security Core Dot -->
  <circle cx="24" cy="26" r="3" fill="#10B981" />
  <circle cx="14" cy="17" r="2.5" fill="#00F0FF" />
  <circle cx="34" cy="17" r="2.5" fill="#00F0FF" />
</svg>
