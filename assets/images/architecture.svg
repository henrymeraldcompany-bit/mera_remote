<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bg-box" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#070B14" />
    </linearGradient>
    <linearGradient id="border-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="360" rx="16" fill="#050811" stroke="#1E293B" stroke-width="1.5" />

  <!-- Grid Lines -->
  <path d="M 0 60 H 800 M 0 120 H 800 M 0 180 H 800 M 0 240 H 800 M 0 300 H 800" stroke="#1E293B" stroke-width="0.5" stroke-dasharray="4 4" />
  <path d="M 160 0 V 360 M 320 0 V 360 M 480 0 V 360 M 640 0 V 360" stroke="#1E293B" stroke-width="0.5" stroke-dasharray="4 4" />

  <!-- Node 1: Admin Application -->
  <g transform="translate(60, 100)">
    <rect width="200" height="160" rx="12" fill="url(#bg-box)" stroke="url(#border-cyan)" stroke-width="2"/>
    <rect x="15" y="15" width="28" height="28" rx="6" fill="#00F0FF" fill-opacity="0.1"/>
    <text x="29" y="34" fill="#00F0FF" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold" text-anchor="middle">A</text>
    <text x="52" y="34" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="15" font-weight="600">Admin App</text>
    <text x="15" y="70" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12">• Android Controller APK</text>
    <text x="15" y="92" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12">• Authenticated JWT Session</text>
    <text x="15" y="114" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12">• Fleet Inventory & Telemetry</text>
    <text x="15" y="136" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="11">PORT 8080 / 443 (REST/WSS)</text>
  </g>

  <!-- Connectors from Admin to Cloud -->
  <path d="M 260 180 L 320 180" stroke="#00F0FF" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="290" cy="180" r="4" fill="#00F0FF" />

  <!-- Node 2: MERA Cloud Control Plane -->
  <g transform="translate(320, 70)">
    <rect width="200" height="220" rx="12" fill="url(#bg-box)" stroke="#3B82F6" stroke-width="2"/>
    <rect x="15" y="15" width="28" height="28" rx="6" fill="#3B82F6" fill-opacity="0.1"/>
    <text x="29" y="34" fill="#3B82F6" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold" text-anchor="middle">M</text>
    <text x="52" y="34" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="15" font-weight="600">MERA Cloud</text>
    <text x="15" y="70" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12">• Zero-Trust 5-Point Auth</text>
    <text x="15" y="92" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12">• Real-Time WSS Hub</text>
    <text x="15" y="114" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12">• 30s Grace Reconnect</text>
    <text x="15" y="136" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12">• Tamper-Evident Audit</text>
    <text x="15" y="158" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12">• 6-Digit OTP Pairing Hub</text>
    <rect x="15" y="175" width="170" height="28" rx="6" fill="#1E293B" />
    <text x="100" y="193" fill="#00F0FF" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">SQLite + Argon2id</text>
  </g>

  <!-- Connectors from Cloud to Agents -->
  <path d="M 520 150 L 570 120" stroke="#10B981" stroke-width="2" stroke-dasharray="6 4"/>
  <path d="M 520 210 L 570 240" stroke="#00F0FF" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- Node 3: Android Agent -->
  <g transform="translate(570, 50)">
    <rect width="180" height="120" rx="10" fill="url(#bg-box)" stroke="#10B981" stroke-width="2"/>
    <text x="15" y="28" fill="#10B981" font-family="'Inter', sans-serif" font-size="14" font-weight="600">Android Agent</text>
    <text x="15" y="52" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">• Foreground Notification</text>
    <text x="15" y="72" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">• Physical Consent Modal</text>
    <text x="15" y="92" fill="#EF4444" font-family="'Inter', sans-serif" font-size="11">• Notification Kill Switch</text>
  </g>

  <!-- Node 4: Windows Agent -->
  <g transform="translate(570, 190)">
    <rect width="180" height="120" rx="10" fill="url(#bg-box)" stroke="#00F0FF" stroke-width="2"/>
    <text x="15" y="28" fill="#00F0FF" font-family="'Inter', sans-serif" font-size="14" font-weight="600">Windows Agent</text>
    <text x="15" y="52" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">• Legitimate Service / Tray</text>
    <text x="15" y="72" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">• Console Banner &amp; Chime</text>
    <text x="15" y="92" fill="#EF4444" font-family="'Inter', sans-serif" font-size="11">• Instant [K] Kill Switch</text>
  </g>
</svg>
