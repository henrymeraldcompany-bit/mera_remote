server {
    listen 80;
    listen [::]:80;
    server_name devices.mera.io; # Replace with your custom domain or IP

    # Redirect all plain HTTP traffic to HTTPS (recommended in production)
    # return 301 https://$host$request_uri;

    root /var/www/mera/website;
    index index.html;

    # Charset
    charset utf-8;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' http://localhost:8080 http://127.0.0.1:8080;" always;

    # Root location
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static Assets Caching (CSS, JS, SVG, Images)
    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Binary Release Downloads Configuration (.apk, .exe, .zip)
    location /downloads/ {
        # Custom MIME types
        types {
            application/vnd.android.package-archive apk;
            application/octet-stream                exe;
            application/zip                         zip;
        }

        # Force download prompt
        add_header Content-Disposition "attachment";
        add_header Cache-Control "public, max-age=604800";
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
